name: fx2-sdcc-ci
on:
  push:
    branches:
      - ci/fx2-sdcc-20261001
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install SDCC
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y sdcc
          sdcc --version
      - name: Pack SDCC toolchain
        run: |
          set -eux
          mkdir -p sdcc-root/usr/bin sdcc-root/usr/share
          cp -a /usr/bin/sd* sdcc-root/usr/bin/
          cp -a /usr/share/sdcc sdcc-root/usr/share/
          tar -C sdcc-root -czf sdcc-linux-x64.tar.gz usr
          sha256sum sdcc-linux-x64.tar.gz > sdcc-linux-x64.tar.gz.sha256
          ls -lh sdcc-linux-x64.tar.gz
          ls -l sdcc-root/usr/bin
      - uses: actions/upload-artifact@v4
        with:
          name: sdcc-linux-x64
          path: |
            sdcc-linux-x64.tar.gz
            sdcc-linux-x64.tar.gz.sha256
